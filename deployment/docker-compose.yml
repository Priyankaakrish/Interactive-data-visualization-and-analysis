# =============================================================================
# Full real-time stack.
#
#   docker compose -f deployment/docker-compose.yml up -d --build
#
# Run from the project root; every bind mount is relative to it.
# =============================================================================

name: retail-bi

services:

  # --------------------------------------------------------------- warehouse
  postgres:
    image: postgres:16-alpine
    container_name: retail-postgres
    environment:
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: retail
      POSTGRES_DB: retail
    ports:
      - "55432:5432"          # 5433 on the host so it cannot clash with pgserver
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../sql/07_streaming.sql:/docker-entrypoint-initdb.d/07_streaming.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail -d retail"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ------------------------------------------------------------------- kafka
  kafka:
    image: apache/kafka:3.7.1
    container_name: retail-kafka
    ports:
      - "29192:29092"        # host access for a natively-run producer
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29192
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: retail-bi-cluster-0001
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 12s
      retries: 20
      start_period: 60s

  kafka-init:
    image: apache/kafka:3.7.1
    container_name: retail-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
         --create --if-not-exists --topic retail.invoices
         --partitions 3 --replication-factor 1
       && echo 'topic retail.invoices ready'"
    restart: "no"

  # ------------------------------------------------------------------- spark
  spark:
    image: apache/spark:3.5.1-scala2.12-java11-python3-ubuntu
    container_name: retail-spark
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: retail.invoices
      PG_URL: jdbc:postgresql://postgres:5432/retail
      PG_USER: retail
      PG_PASSWORD: retail
      STREAM_WINDOW: "1 hour"
      STREAM_WATERMARK: "2 hours"
      SPARK_CHECKPOINT: /tmp/checkpoints/retail
    volumes:
      - ../streaming:/opt/streaming:ro
      - sparkcheck:/tmp/checkpoints
    user: root
    command: >
      /opt/spark/bin/spark-submit
        --master local[2]
        --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,org.postgresql:postgresql:42.7.3
        --conf spark.jars.ivy=/tmp/.ivy
        /opt/streaming/spark_consumer.py
    restart: unless-stopped

  # ---------------------------------------------------------------- producer
  producer:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.producer
    container_name: retail-producer
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: retail.invoices
      STREAM_SOURCE: /app/data/stream/source.csv
    volumes:
      - ../data/stream:/app/data/stream:ro
    command: ["--speed", "20000", "--rate", "400", "--loop"]
    restart: unless-stopped

  # --------------------------------------------------------------------- api
  api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: retail-api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      EXTRACT_DIR: /app/data/processed
      STREAM_DSN: postgresql+psycopg://retail:retail@postgres:5432/retail
      STREAM_ENABLED: "1"
      CORS_ORIGINS: "*"
    volumes:
      - ../data/processed:/app/data/processed:ro
    restart: unless-stopped

volumes:
  pgdata:
  sparkcheck:
