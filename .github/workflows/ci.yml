name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy SQLAlchemy
          pip install fastapi "pydantic>=2" httpx pytest pytest-cov

      - name: Compile every module
        run: python -m compileall -q src api streaming orchestration

      - name: Run tests
        run: pytest tests/ -v --cov=src --cov=api --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: .coverage
          if-no-files-found: ignore

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Ruff
        run: ruff check src api streaming orchestration tests --output-format=github

  sql:
    name: Validate SQL syntax
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: retail
          POSTGRES_PASSWORD: retail
          POSTGRES_DB: retail
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U retail"
          --health-interval 5s --health-timeout 3s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Apply the streaming schema
        env:
          PGPASSWORD: retail
        run: |
          psql -h localhost -U retail -d retail -v ON_ERROR_STOP=1 \
               -f sql/07_streaming.sql
          psql -h localhost -U retail -d retail -c \
               "SELECT count(*) AS stream_tables FROM information_schema.tables
                WHERE table_schema = 'stream';"

  docker:
    name: Build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile
          push: false
          tags: retail-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate compose file
        run: docker compose -f deployment/docker-compose.yml config --quiet
